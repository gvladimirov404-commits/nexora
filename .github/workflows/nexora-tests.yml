name: NEXORA Forge Tests

on:
  push:

permissions:
  contents: read

jobs:
  forge-test:
    name: forge_test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Forge tests
        run: forge test
